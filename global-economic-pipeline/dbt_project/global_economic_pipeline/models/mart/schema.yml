version: 2

models:
  - name: mart_economic_snapshot
    description: >
      Final global economic snapshot. One row per country per indicator per year.
      Covers 30 countries across G7, BRICS, ASEAN, Mercosur, USMCA, CPTPP.
      18 indicators from World Bank, IMF, and UNDP.
      Indicators appear automatically when added to indicators.csv.
      IMF indicators include projections beyond the current year.
    columns:
      - name: country_code
        description: "ISO3 country code"
        data_tests:
          - not_null
      - name: country_name
        data_tests:
          - not_null
      - name: bloc
        description: "Economic bloc: G7, BRICS, ASEAN, Mercosur, USMCA, CPTPP"
        data_tests:
          - not_null
      - name: observation_year
        data_tests:
          - not_null
      - name: indicator_code
        description: "Indicator code from source API"
        data_tests:
          - not_null
      - name: indicator_name
        description: "Indicator name from indicators.csv"
        data_tests:
          - not_null
      - name: source
        description: "Data source: worldbank, imf, or undp"
        data_tests:
          - not_null
          - accepted_values:
              values: ['worldbank', 'imf', 'undp']
      - name: indicator_value
        description: "Numeric value of the indicator"
      - name: dbt_updated_at
        description: "Timestamp of when this row was last built by dbt"
        data_tests:
          - not_null