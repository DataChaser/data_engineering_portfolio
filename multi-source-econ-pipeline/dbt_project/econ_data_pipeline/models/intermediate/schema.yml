version: 2

models:
  - name: int_economic_indicators
    description: >
      Dataset combining all three sources.
      One row per country per indicator per year.
      Long format chosen so indicator coverage can grow via CSV config with no SQL changes required.
    columns:
      - name: country_code
        description: "ISO3 country code"
        data_tests:
          - not_null
      - name: observation_year
        data_tests:
          - not_null
      - name: indicator_code
        data_tests:
          - not_null
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              values: ['worldbank', 'imf', 'undp']